changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: 🚀 新機能
      labels:
        - Feature
    - title: 🐛 バグ修正
      labels:
        - Bug
    - title: 🛠 リファクタリング
      labels:
        - Refactoring
    - title: ⚙️ CI
      labels:
        - CI/CD
    - title: 📖 ドキュメント
      labels:
        - Documentation
    - title: 📦 依存関係の更新
      labels:
        - dependencies
    - title: その他の変更
      labels:
        - "*"
