name: Release docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: image-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release eligibility
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check package.json version and release tag
        id: release
        run: |
          if ! git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(git show "$GITHUB_SHA^:package.json" | jq -r '.version')"
          current_version="$(jq -r '.version' package.json)"

          if ! printf '%s\n' "$current_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid package.json version: $current_version" >&2
            exit 1
          fi
          if [ "$previous_version" = "$current_version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push docker image (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Prepare image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/seichi-portal-frontend" >> "$GITHUB_OUTPUT"

      - name: Prepare platform pair
        id: platform-pair
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_DEBUG_MODE=false
            NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ steps.platform-pair.outputs.pair }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ steps.platform-pair.outputs.pair }},mode=max,ignore-error=true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform-pair.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Merge manifest and sign image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ github.sha }}
        run: gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
