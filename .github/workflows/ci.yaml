name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint
      - name: Format
        run: pnpm run fmt

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Type check
        run: pnpm run type-check

  codegen-check:
    name: OpenAPI codegen check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # backend main の docs/openapi.json から型を再生成し、src/generated/ に
      # 差分が出ないこと（生成物が最新であること）を検証する。
      - name: Check generated API types are up to date
        run: pnpm run codegen:check

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Unit test
        run: pnpm run test:unit

  component-test:
    name: Component test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Component test
        run: pnpm run test:component

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEBUG_MODE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: pnpm run build

  container:
    name: Container runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Build production image
        run: docker build --pull -t seichi-portal-frontend:ci .

      - name: Check Node.js version and startup
        shell: bash
        run: |
          expected_version=$(node --version)
          actual_version=$(docker run --rm seichi-portal-frontend:ci --version)
          echo "Development: $expected_version, production: $actual_version"
          test "$actual_version" = "$expected_version"

          container_id=$(docker run --rm -d --network none \
            -e MS_APP_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            -e MS_APP_REDIRECT_URL=http://localhost:3000 \
            seichi-portal-frontend:ci)
          trap 'docker logs "$container_id"; docker stop "$container_id" >/dev/null' EXIT
          docker exec "$container_id" /nodejs/bin/node -e '
            async function check() {
              for (let attempt = 0; attempt < 30; attempt++) {
                try {
                  const response = await fetch("http://127.0.0.1:3000/badrequest");
                  if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
                  console.log(`GET /badrequest: ${response.status}`);
                  return;
                } catch (error) {
                  if (attempt === 29) throw error;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
            }
            check().catch(error => { console.error(error); process.exitCode = 1; });
          '
