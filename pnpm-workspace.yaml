minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
# レンジ内に minimumReleaseAge を満たすバージョンが存在しない場合、エラーにせず
# 若いバージョンへフォールバックする。Renovate / Dependabot のセキュリティ更新が
# 若い transitive 依存（例: rollup）に阻まれて
# ERR_PNPM_NO_MATURE_MATCHING_VERSION で失敗するのを防ぐ (#926)。
minimumReleaseAgeStrict: false
overrides:
  minimatch: ^11.0.3
  # GHSA-5p4m-2wfm-xmqj: @redocly/openapi-core が js-yaml を 4.3.0 に固定して
  # おり、Dependabot 側では解消できないため override で 4.3.1 以上に上げる。
  # 上流が追従したら削除する。
  js-yaml@4: ^4.3.2

allowBuilds:
  # @pyroscope/nodejs の native 依存。現行版の install script は `exit 0` で
  # prebuild 同梱のためビルド不要。将来版で本当に script が必要になった時点で
  # 再審査する (安易に true にしない)
  '@datadog/pprof': false
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: minimatch@11.0.3
  - minimatch@11.0.3
